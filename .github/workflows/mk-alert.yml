name: MK alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "cases = replay my known setups, debug = explain one time, history = list recent setups, test = test message, run = normal check"
        default: "cases"
        type: choice
        options:
          - cases
          - debug
          - history
          - test
          - run
      symbol:
        description: "debug only: XAUUSD or GBPUSD"
        default: "XAUUSD"
        type: string
      tf:
        description: "debug only: timeframe in minutes (5, 15 or 30)"
        default: "5"
        type: string
      time:
        description: "debug only: time to look at, UTC+3:30, format YYYY-MM-DD HH:MM"
        default: "2026-09-15 17:00"
        type: string
      hours:
        description: "debug only: hours of context before that time"
        default: "12"
        type: string

permissions:
  contents: write

concurrency:
  group: mk-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run MK alert
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HISTORY_DAYS: "5"
          DEBUG_SYMBOL: ${{ github.event.inputs.symbol }}
          DEBUG_TF: ${{ github.event.inputs.tf }}
          DEBUG_TIME: ${{ github.event.inputs.time }}
          DEBUG_HOURS: ${{ github.event.inputs.hours }}
        run: python mk_alert.py ${{ github.event.inputs.mode == 'test' && '--test' || '' }} ${{ github.event.inputs.mode == 'history' && '--history' || '' }} ${{ github.event.inputs.mode == 'cases' && '--cases' || '' }} ${{ github.event.inputs.mode == 'debug' && '--debug' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "mk-bot"
            git config user.email "mk-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
