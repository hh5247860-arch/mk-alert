name: MK alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send a test message, history = list recent MK setups, run = normal check"
        default: "test"
        type: choice
        options:
          - test
          - history
          - run

permissions:
  contents: write

concurrency:
  group: mk-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run MK alert
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HISTORY_DAYS: "5"
        run: python mk_alert.py ${{ github.event.inputs.mode == 'test' && '--test' || '' }} ${{ github.event.inputs.mode == 'history' && '--history' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "mk-bot"
            git config user.email "mk-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
